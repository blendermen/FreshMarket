apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: freshmarket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: freshmarket-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: freshmarket-secrets
            - configMapRef:
                name: freshmarket-config
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: freshmarket
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: 4000
