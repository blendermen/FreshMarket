# Copy to secrets.yaml and apply: kubectl apply -f secrets.yaml -n freshmarket
apiVersion: v1
kind: Secret
metadata:
  name: freshmarket-secrets
  namespace: freshmarket
type: Opaque
stringData:
  DATABASE_URL: postgresql://freshmarket:CHANGE_ME@postgres:5432/freshmarket?schema=public
  JWT_ACCESS_SECRET: change-me-access
  JWT_REFRESH_SECRET: change-me-refresh
  postgres-password: CHANGE_ME
  minio-access-key: minioadmin
  minio-secret-key: CHANGE_ME
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  NEXTAUTH_SECRET: change-me-nextauth
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: freshmarket-config
  namespace: freshmarket
data:
  CORS_ORIGIN: https://freshmarket.local
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_BUCKET: freshmarket
  MINIO_PUBLIC_URL: https://minio.freshmarket.local/freshmarket
  NEXT_PUBLIC_API_URL: https://api.freshmarket.local/v1
  NEXTAUTH_URL: https://freshmarket.local
  NOMINATIM_USER_AGENT: FreshMarket/1.0 (you@example.com)
