services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: freshmarket
      POSTGRES_PASSWORD: freshmarket
      POSTGRES_DB: freshmarket
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freshmarket']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/freshmarket --ignore-existing;
      mc anonymous set download local/freshmarket;
      exit 0;
      "

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../apps/api/.env
    environment:
      DATABASE_URL: postgresql://freshmarket:freshmarket@postgres:5432/freshmarket?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_PUBLIC_URL: http://localhost:9000/freshmarket
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    profiles:
      - full

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/v1
    env_file:
      - ../../apps/web/.env.local
    ports:
      - '3000:3000'
    depends_on:
      - api
    profiles:
      - full

volumes:
  postgres_data:
  minio_data:
